<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>คู่มือ · Chiangmai Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Allura&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/system.css">
<style>
  .a-head { display: grid; gap: var(--s-4); padding-block: var(--s-5) var(--s-6); max-width: 820px; }
  .a-head h1 { font-size: clamp(2.25rem, 1.6rem + 2.8vw, 3.75rem); line-height: 1.2; }
  .a-head .dek { font-size: clamp(1.125rem, 1rem + 0.5vw, 1.375rem); line-height: 1.6; color: var(--text); }
  .a-head .meta { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-4); color: var(--text-2); font-size: var(--fs-small); align-items: center; }
  .a-media { aspect-ratio: 21 / 9; border-radius: var(--r-xl); }
  @media (max-width: 767px) { .a-media { aspect-ratio: 4 / 3; border-radius: var(--r-lg); } }
  .a-body { display: grid; gap: var(--s-7); padding-top: var(--s-7); }
  @media (min-width: 1024px) { .a-body { grid-template-columns: minmax(0, 68ch) 1fr; gap: var(--s-8); } .a-side { position: sticky; top: 96px; align-self: start; } }
  .prose { display: grid; gap: var(--s-6); }
  .prose h2 { font-size: 1.5rem; line-height: 1.4; margin-bottom: var(--s-3); }
  .prose p { font-size: 1.125rem; line-height: 1.8; color: var(--text); }
  .prose .mention { color: var(--brand); text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; font-weight: 500; }
  .a-side h2 { font-size: var(--fs-title); margin-bottom: var(--s-4); }
  .a-side .list { display: grid; gap: var(--s-3); }
  .a-side .pcard .media { aspect-ratio: 1; min-height: 0; }
  .a-side .pcard { grid-template-columns: 96px 1fr; }
  .a-side .pcard .meta { padding-right: 48px; }
  .a-side .pcard .fav { display: none; }
  .next { margin-top: var(--s-9); }
</style>
</head>
<body>
<main id="main" class="wrap"></main>
<script src="assets/catalogue.js"></script>
<script src="assets/shell.js"></script>
<script>
  const { icon, bySlug, img, placeCard, CAT, C } = UI;
  UI.mount("guides");
  const g = C.guides.find((x) => x.s === (new URLSearchParams(location.search).get("s") || "temples-of-the-old-city"));
  document.title = `${g.title} · Chiangmai Journey`;
  const cover = { "temples-of-the-old-city": "wat-phra-singh" };
  const ph = cover[g.s] && bySlug(cover[g.s]);
  const places = g.places.map(bySlug);
  // Link a place the first time its Thai name appears in the text
  const seen = new Set();
  const linkify = (t) => places.reduce((acc, p) => {
    const name = p.th.split(" (")[0];
    if (seen.has(p.s) || !acc.includes(name)) return acc;
    seen.add(p.s);
    return acc.replace(name, `<a class="mention" href="place.html?s=${p.s}">${name}</a>`);
  }, t);
  const fmtDate = (d) => new Date(d).toLocaleDateString("th-TH", { day: "numeric", month: "long", year: "numeric" });
  document.getElementById("main").innerHTML = `
    <nav class="crumbs" aria-label="เส้นทาง"><a href="home.html">หน้าแรก</a>${icon("right")}<a href="guides.html">คู่มือ</a></nav>
    <header class="a-head">
      <h1>${g.title}</h1>
      <p class="dek">${g.dek}</p>
      <p class="meta num"><span>${icon("book", "i--sm")} อ่าน ${g.read} นาที</span><span>${fmtDate(g.at)}</span><span>${icon("pin", "i--sm")} ${places.length} สถานที่</span></p>
    </header>
    ${ph ? `<figure style="margin:0"><div class="photo graded a-media"><img src="${img(ph.s)}" alt="${ph.th}"></div><figcaption class="credit" style="margin-top:8px">${ph.th} — ภาพ: ${ph.credit.by} · ${ph.credit.lic} · Wikimedia Commons</figcaption></figure>`
      : `<div class="noimg a-media" aria-hidden="true"><span class="ring">${icon(g.s.includes("cafe") ? "coffee" : "pin", "i--xl")}</span><span class="zone">${places.map((p) => p.th).join(" · ")}</span></div>`}
    <div class="a-body">
      <article class="prose">${g.sections.map((s) => `<section><h2>${s.h}</h2><p>${linkify(s.b)}</p></section>`).join("")}</article>
      <aside class="a-side" aria-labelledby="h-in"><h2 id="h-in">สถานที่ในเรื่องนี้</h2><div class="list">${places.map((p) => placeCard(p)).join("")}</div></aside>
    </div>
    <section class="next" aria-labelledby="h-next">
      <div class="sec-head"><h2 id="h-next">อ่านต่อ</h2><span class="rule"></span></div>
      <div style="display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${C.guides.filter((x) => x.s !== g.s).map((x) => `<a class="box" style="padding:20px;display:grid;gap:6px" href="guide.html?s=${x.s}"><b style="font-weight:600;color:var(--brand)">${x.title}</b><span class="t-small t-muted">${x.dek}</span></a>`).join("")}</div>
    </section>`;
</script>
</body>
</html>
